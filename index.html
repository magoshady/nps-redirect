<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Customer Feedback · Impressive Electrical</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 24px;
            background: #f6f7f9; color: #1e2126;
        }
        .card {
            background: #fff; border: 1px solid #e6e8ec; border-radius: 14px;
            box-shadow: 0 6px 28px rgba(20, 24, 31, .08);
            padding: 40px 36px; max-width: 480px; text-align: center;
        }
        .brand {
            font-size: 13px; font-weight: 600; letter-spacing: .08em;
            text-transform: uppercase; color: #e0001a; margin-bottom: 22px;
        }
        h1 { font-size: 22px; margin: 0 0 12px; }
        p { font-size: 16px; line-height: 1.55; color: #565d68; margin: 12px 0 0; }
        a { color: #e0001a; }
    </style>
</head>
<body>
    <!--
        This page is deliberately static.

        It previously read query parameters and redirected to script.google.com
        via JavaScript. An open redirect on the root of the sending domain is a
        strong phishing signal and would undermine the point of moving the
        survey onto our own domain. Ratings are handled at /r only.
    -->
    <main class="card">
        <div class="brand">Impressive Electrical</div>
        <h1>Customer feedback</h1>
        <p>This site handles feedback surveys for Impressive Electrical customers.</p>
        <p>If you're looking to rate a recent installation, please use the buttons in the email we sent you.</p>
        <p><a href="https://impressivebatteries.com.au">impressivebatteries.com.au</a></p>
    </main>
</body>
</html>
